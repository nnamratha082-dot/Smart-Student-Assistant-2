<!DOCTYPE html>
<html>
<head>
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📅 Calendar</h1>

<h2 id="date"></h2>

<button onclick="showDate()">Show Today's Date</button>

<script>
function showDate() {
    let today = new Date();
    document.getElementById("date").innerHTML = today.toDateString();
}
</script>

</body>
</html>
